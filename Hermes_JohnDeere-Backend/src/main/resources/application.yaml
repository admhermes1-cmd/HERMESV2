# ============================================================
# HERMES Backend — Configuração Principal (Profile: default / produção)
# ============================================================

# ── Servidor ────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ── Aplicação Spring ────────────────────────────────────────
spring:
  application:
    name: hermes-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── DataSource (PostgreSQL + HikariCP) ────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hermes}
    username: ${DATABASE_USERNAME:hermes}
    password: ${DATABASE_PASSWORD:hermes}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HermesHikariPool
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ── Flyway — migrations automáticas de schema ─────────────
  # Deve estar no nível de spring, NÃO dentro de jpa.
  # baseline-on-migrate: cria a tabela flyway_schema_history
  # automaticamente em bancos que já existem sem histórico Flyway.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false

  # ── E-mail ────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

  # ── Jackson ───────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# ── Configurações proprietárias do HERMES ───────────────────
hermes:

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  mail:
    from: ${MAIL_FROM:noreply@hermes.com}
    from-name: ${MAIL_FROM_NAME:HERMES Notificações}
    max-size-bytes: 10485760

  admin:
    email: ${ADMIN_EMAIL:admin@hermes.com}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME:Administrador}

  scheduler:
    cron: "*/30 * * * * *"
    max-retry-attempts: 3

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://tentativan2.vercel.app}

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.hermes: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/hermes.log}

# ── SpringDoc / Swagger UI ──────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha