# ============================================================
# HERMES Backend — Configuração de Desenvolvimento (Profile: dev)
# ============================================================
# ⚠️ NÃO USAR EM PRODUÇÃO
# ============================================================

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # Lê DATABASE_URL (Railway) com fallback para banco local
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hermes_dev}
    username: ${DATABASE_USERNAME:${PGUSER:hermes}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:hermes}}
    hikari:
      pool-name: HermesHikariPool
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ── JPA — indentação correta: irmão de datasource, não filho ──
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        generate_statistics: false

  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

hermes:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-hermes-nao-usar-em-producao-0000000000000}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  mail:
    from: ${MAIL_FROM:admhermes1@gmail.com}
    from-name: ${MAIL_FROM_NAME:HERMES Notificações}
    max-size-bytes: 10485760

  admin:
    email: ${ADMIN_EMAIL:admin@hermes.local}
    password: ${ADMIN_PASSWORD:admin123}
    name: ${ADMIN_NAME:Admin Dev}

  scheduler:
    cron: "*/60 * * * * *"
    max-retry-attempts: 3

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

logging:
  level:
    root: INFO
    com.hermes: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr(%logger{30}){cyan} - %msg%n"
  file:
    name: ""

springdoc:
  swagger-ui:
    enabled: true
    persist-authorization: true