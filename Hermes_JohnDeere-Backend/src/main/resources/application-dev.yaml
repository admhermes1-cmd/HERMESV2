# ============================================================
# HERMES Backend — Configuração de Desenvolvimento (Profile: dev)
# ============================================================
# ⚠️  NÃO USAR EM PRODUÇÃO — configurações intencionalmente
#     inseguras para facilitar o desenvolvimento local.
#     Senhas em texto puro, CORS aberto, SQL visível, etc.
# ============================================================
# Como ativar:
#   SPRING_PROFILES_ACTIVE=dev mvn spring-boot:run
#   ou via IDE: adicione -Dspring.profiles.active=dev nas VM options
# ============================================================

# ── DataSource — banco local, sem variáveis de ambiente obrigatórias ──
spring:
  datasource:
    # Banco local criado manualmente:
    #   createdb hermes_dev   (ou via psql / pgAdmin)
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hermes_dev}
    username: ${DATABASE_USERNAME:hermes}
    password: ${DATABASE_PASSWORD:hermes}
    hikari:
      # Pool menor em dev — menos paralelismo, mais fácil de debugar
      maximum-pool-size: 3
      minimum-idle: 1

  # ── JPA — Hibernate cria/atualiza o schema automaticamente em dev ──
  jpa:
    hibernate:
      # 'update': adiciona colunas/tabelas novas mas não remove existentes.
      # ⚠️ Nunca usar 'create-drop' em dev com dados que você quer preservar.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true            # SQL indentado no console para leitura fácil
        # Habilita estatísticas de query — útil para detectar N+1
        generate_statistics: false

  # ── E-mail — Gmail SMTP (mesmo config de produção) ──
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ── Configurações proprietárias do HERMES ───────────────────
hermes:

  # JWT — secret simples para dev (NÃO use em produção)
  # Em produção, gere com: openssl rand -hex 32
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-hermes-nao-usar-em-producao-0000000000000}
    expiration: ${JWT_EXPIRATION:86400000}           # 24h em dev (evita login frequente)
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  # E-mail — remetente
  mail:
    from: admhermes1@gmail.com
    from-name: ${MAIL_FROM_NAME:HERMES Notificações}
    max-size-bytes: 10485760

  # Admin — senha em texto puro apenas para dev.
  # O DataInitializer.java deve detectar o profile e aplicar
  # bcrypt apenas quando necessário, ou sempre fazer encode via BCryptPasswordEncoder.
  # ⚠️ Em produção, ADMIN_PASSWORD deve ser o hash bcrypt da senha.
  admin:
    email: ${ADMIN_EMAIL:admin@hermes.local}
    password: ${ADMIN_PASSWORD:admin123}             # ⚠️ apenas dev
    name: ${ADMIN_NAME:Admin Dev}

  # Scheduler — intervalo maior em dev para não poluir logs
  scheduler:
    cron: "*/60 * * * * *"          # verifica a cada 60s em dev
    max-retry-attempts: 3

  # CORS — permissivo em dev para facilitar testes com Vite, Storybook, etc.
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://localhost:4173"

# ── Logging — verboso em dev para facilitar debugging ───────
logging:
  level:
    root: INFO
    com.hermes: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE  # mostra valores dos parâmetros SQL
  pattern:
    # Cores no console para melhor legibilidade em dev (ANSI)
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr(%logger{30}){cyan} - %msg%n"
  # Em dev não precisa gravar em arquivo — apenas console
  file:
    name: ""

# ── SpringDoc — Swagger liberado e com exemplos detalhados ──
springdoc:
  swagger-ui:
    enabled: true
    # Tenta req automaticamente usando o token JWT após login
    persist-authorization: true